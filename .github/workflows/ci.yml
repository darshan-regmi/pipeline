name: CI

# Builds and tests Pipeline on a hosted macOS runner.
#
# Two details worth knowing before editing this file:
#
#   1. The scheme is committed at
#      `pipeline.xcodeproj/xcshareddata/xcschemes/pipeline.xcscheme`. Xcode
#      keeps user schemes in `xcuserdata/`, which git ignores, so without the
#      shared copy `-scheme pipeline` does not resolve on a fresh checkout.
#
#   2. Hosted images change their simulator set and their Xcode version, so the
#      job discovers an iPhone simulator by UDID instead of naming a device
#      that may not exist on the image.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PROJECT: pipeline.xcodeproj
  SCHEME: pipeline

jobs:
  test:
    name: Build & test
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Select the newest installed Xcode
        run: |
          set -euo pipefail
          # Hosted images ship several Xcode versions. Take the highest.
          latest=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "${latest}" ]; then
            sudo xcode-select -s "${latest}/Contents/Developer"
          fi
          echo "Using: ${latest:-system default}"
          xcodebuild -version

      - name: Discover an iPhone simulator
        id: sim
        run: |
          set -euo pipefail
          # Sort installed iOS runtimes by version, newest first, and take the
          # first runtime that actually contains a bootable iPhone device.
          udid=$(xcrun simctl list devices available --json | jq -r '
            .devices
            | to_entries
            | map(select(.key | test("SimRuntime\\.iOS")))
            | sort_by(
                (.key | capture("iOS-(?<v>[0-9-]+)").v)
                | gsub("-"; ".")
                | split(".")
                | map(tonumber)
              )
            | reverse
            | map(.value | map(select(.name | startswith("iPhone"))))
            | map(select(length > 0))
            | .[0][0].udid // empty')

          if [ -z "${udid}" ]; then
            echo "::error::No iPhone simulator is installed on this runner."
            echo "Available runtimes:"
            xcrun simctl list runtimes
            exit 1
          fi

          name=$(xcrun simctl list devices available | grep "${udid}" | head -n 1 || true)
          echo "Selected simulator: ${name}"
          echo "udid=${udid}" >> "${GITHUB_OUTPUT}"

      - name: Run tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project "${PROJECT}" \
            -scheme "${SCHEME}" \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath .derivedData \
            -resultBundlePath TestResults/ci.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild-test.log

      - name: Upload results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            TestResults/
            xcodebuild-test.log
          if-no-files-found: ignore
          retention-days: 7
